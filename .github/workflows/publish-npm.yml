name: Stage npm release for approval

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing verified release tag (for example v0.2.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ inputs.tag }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/create-harness-agile
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: npm-distribution
          path: dist
      - run: npm stage publish ./dist/*.tgz --access public --ignore-scripts --provenance --registry https://registry.npmjs.org
      - name: Explain approval requirement
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### npm release staged
          This run uploads a candidate only. A maintainer must review and approve it with 2FA on npm before it becomes public.
          Review staged releases: https://www.npmjs.com/package/create-harness-agile
          SUMMARY
