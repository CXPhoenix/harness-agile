name: Build verified release packages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_TAG"]), "Expected vMAJOR.MINOR.PATCH"'
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.21'
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          py = tomllib.loads(Path('pyproject.toml').read_text())['project']
          npm = json.loads(Path('package.json').read_text())
          assert py['name'] == 'harness-agile'
          assert npm['name'] == 'create-harness-agile'
          assert 'v' + py['version'] == 'v' + npm['version'] == os.environ['RELEASE_TAG']
          PY
      - run: npm install --global pnpm@11.14.0
      - run: python scripts/sync-skills.py
      - run: python scripts/verify-project.py
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
        working-directory: .agents/skills/archify
      - run: npm run test:portable && npm run test:preview
        working-directory: .agents/skills/archify
      - run: npm audit --package-lock-only --ignore-scripts
        working-directory: .agents/skills/archify
      - run: python -c "import shutil; shutil.rmtree('.agents/skills/archify/node_modules')"
      - run: uv build --out-dir dist
      - run: npm pack --pack-destination dist
      - name: Verify distributions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          python scripts/verify-distributions.py --wheel "dist/harness_agile-${version}-py3-none-any.whl" --npm "dist/create-harness-agile-${version}.tgz"
          uvx --from twine twine check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-distribution
          path: dist/*.tgz
          if-no-files-found: error
