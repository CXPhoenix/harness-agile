name: Verify template and packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
      - run: npm install --global pnpm@11.14.0
      - run: python scripts/sync-skills.py
      - run: python scripts/verify-project.py
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
        working-directory: .agents/skills/archify
      - run: npm run test:portable
        working-directory: .agents/skills/archify
      - run: npm run test:preview
        working-directory: .agents/skills/archify
      - run: npm audit --package-lock-only --ignore-scripts
        working-directory: .agents/skills/archify
      - name: Remove development dependencies before packaging
        shell: python
        run: |
          import shutil
          shutil.rmtree('.agents/skills/archify/node_modules')
      - run: uv build --out-dir dist
      - run: npm pack --pack-destination dist
      - run: python scripts/verify-distributions.py --wheel dist/harness_agile-0.2.1-py3-none-any.whl --npm dist/create-harness-agile-0.2.1.tgz
