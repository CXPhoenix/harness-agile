# Project defaults; effective only after this checkout is trusted locally.
# Account credentials, project trust and model selection stay in the host.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[agents]
enabled = true
max_concurrent_threads_per_session = 4

[sandbox_workspace_write]
network_access = false

# CodeGraph code map; install the CLI per machine (docs/agents/codegraph.md).
# env turns off telemetry and the daily update check.
[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]
env = { DO_NOT_TRACK = "1", CODEGRAPH_TELEMETRY = "0" }
