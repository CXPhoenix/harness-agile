[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "harness-agile"
version = "0.1.0"
description = "Create portable Claude Code and Codex project workspaces"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
harness-agile = "harness_agile.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["harness_agile"]

[tool.hatch.build.targets.sdist]
include = ["harness_agile", "pyproject.toml", "hatch_build.py", "README.md"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
